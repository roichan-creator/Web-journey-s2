<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 8.1 - Ukuran Elemen</title>
    <style>
        h1 {
            font-size: 32px;
            color: #333;
            text-align: center;
        }

        p {
            font-size: 12pt;
            line-height: 1.5;
            color: #555;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
        }

        .box-cm {
            width: 10cm;
            height: 5cm;
            background-color: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .box-percent {
            width: 80%;
            height: 100px;
            background-color: #e74c3c;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>Tugas 8.1: Satuan Ukuran CSS</h1>
    
    <p>Halaman ini mendemonstrasikan penggunaan berbagai satuan ukuran dalam CSS seperti px, pt, cm, dan %.</p>

    <div class="container">
        <div class="box-cm">
            Box 10cm x 5cm
        </div>

        <div class="box-percent">
            Box Lebar 80%
        </div>
    </div>

</body>
</html>
