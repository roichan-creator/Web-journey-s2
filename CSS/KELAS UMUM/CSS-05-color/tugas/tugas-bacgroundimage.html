<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas Background Image</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-image: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .content-card {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(15px);
      padding: 50px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      text-align: center;
      max-width: 600px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="content-card">
    <h1>Background Image</h1>
    <p>
      Halaman ini menggunakan gambar latar belakang yang diambil dari URL eksternal. 
      Dengan menggunakan properti <code>background-size: cover</code>, gambar akan memenuhi seluruh layar secara proporsional.
    </p>
  </div>

</body>
</html>
