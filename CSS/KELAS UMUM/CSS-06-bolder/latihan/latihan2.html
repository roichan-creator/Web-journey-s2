<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan 2 - Kartu Profil</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .profile-card {
      background-color: white;
      width: 300px;
      border: 2px solid gray;
      border-radius: 15px;
      padding: 20px;
      
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .profile-card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 2px solid #ddd;
    }

    .profile-card h2 {
      margin: 10px 0 5px;
      color: #333;
    }

    .profile-card p {
      color: #666;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .btn-follow {
      margin-top: 15px;
      padding: 8px 20px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-follow:hover {
      background-color: #555;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <img src="https://via.placeholder.com/100" alt="Foto Profil">
    <h2>John Doe</h2>
    <p>Web Developer & Designer yang hobi belajar hal baru tentang teknologi frontend.</p>
    <button class="btn-follow">Follow</button>
  </div>

</body>
</html>
