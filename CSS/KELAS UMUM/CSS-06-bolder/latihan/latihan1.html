<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan 1 - CSS Border</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .box {
      width: 200px;
      height: 100px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    .solid-black {
      border: 5px solid black;
    }

    .double-blue {
      border: 5px double blue;
    }

    .groove-green {
      border: 5px groove green;
    }

    .ridge-red {
      border: 5px ridge red;
    }
  </style>
</head>
<body>

  <h1>Latihan 1: Jenis Garis</h1>

  <div class="box solid-black">Solid Black</div>
  <div class="box double-blue">Double Blue</div>
  <div class="box groove-green">Groove Green</div>
  <div class="box ridge-red">Ridge Red</div>

</body>
</html>
