<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 200px;
        height: 200px;
        position: absolute;
      }
      .satu {
        background-color: salmon;
        z-index: 3;
      }
      .dua {
        background-color: lightgreen;
        top: 100px;
        left: 100px;
        z-index: 2;
      }
      .tiga {
        background-color: royalblue;
        top: 200px;
        left: 200px;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="satu">
      <img
        src="/CSS/CSS position z-index/tugas/aura_bg.png"
        width="200px"
        height="200px"
      />
    </div>
    <div class="dua">
      <img
        src="/CSS/CSS position z-index/tugas/Screenshot (4).png"
        width="200px"
        height="200px"
      />
    </div>
    <div class="tiga">
      <img
        src="/CSS/CSS position z-index/tugas/Screenshot (6).png"
        width="200px"
        height="200px"
      />
    </div>
  </body>
</html>
